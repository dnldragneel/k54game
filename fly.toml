# Fly.io config for the K54 race server in JOHANNESBURG (closest region to South African players).
# Steps are in README.md ("Johannesburg on Fly.io"). The only secret, SUPABASE_SERVICE_ROLE_KEY, is set with
# `fly secrets set` in YOUR terminal - it is never written in this file, the game or a chat.
#
# Change `app` to a name nobody else uses (Fly app names are global), e.g. k54-race-yourname.
app = "k54-race"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SUPABASE_URL = "https://thixvzwnzlkbfbagxwgj.supabase.co"
  # public anon key (same one that is in the game's config.js and render.yaml)
  SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoaXh2enduemxrYmZiYWd4d2dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzkzNzgsImV4cCI6MjEwODUxNTM3OH0.asKUdJW5FHOPnPa9mHT9mcbXtfzNowJ8g6fhiLMYRkU"
  ALLOWED_ORIGINS = "https://k54game.netlify.app,https://localhost"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in this one process's memory: never stop it when quiet, never run a second copy.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "4s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
